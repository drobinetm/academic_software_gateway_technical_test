name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      ENVIRONMENT: ${{ secrets.ENVIRONMENT || 'production' }}
      LOG_LEVEL: ${{ secrets.LOG_LEVEL || 'INFO' }}
      INNOVASOFT_BASE_URL: ${{ secrets.INNOVASOFT_BASE_URL }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
      API_TIMEOUT_SECONDS: ${{ secrets.API_TIMEOUT_SECONDS || '30' }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      CORS_ORIGIN_REGEX: ${{ secrets.CORS_ORIGIN_REGEX }}
      UPSTREAM_OPENAPI_URL: ${{ secrets.UPSTREAM_OPENAPI_URL || 'https://pruebareactjs.test-class.com/Api/swagger/v1/swagger.json' }}
      UPSTREAM_OPENAPI_FETCH_TIMEOUT: ${{ secrets.UPSTREAM_OPENAPI_FETCH_TIMEOUT || '10' }}
      OPENAPI_CACHE_PATH: ${{ secrets.OPENAPI_CACHE_PATH || 'static/innovasoft_openapi_cache.json' }}
      REQUEST_LOGS_COLLECTION: ${{ secrets.REQUEST_LOGS_COLLECTION || 'request_logs' }}
      REQUEST_LOG_TTL_SECONDS: ${{ secrets.REQUEST_LOG_TTL_SECONDS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate required deploy secrets
        run: |
          missing=0
          for name in \
            VERCEL_TOKEN \
            VERCEL_ORG_ID \
            VERCEL_PROJECT_ID \
            INNOVASOFT_BASE_URL \
            MONGODB_URI \
            MONGODB_DATABASE \
            CORS_ORIGINS \
          ; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel output
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        run: >-
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          --env ENVIRONMENT="$ENVIRONMENT"
          --env LOG_LEVEL="$LOG_LEVEL"
          --env INNOVASOFT_BASE_URL="$INNOVASOFT_BASE_URL"
          --env MONGODB_URI="$MONGODB_URI"
          --env MONGODB_DATABASE="$MONGODB_DATABASE"
          --env API_TIMEOUT_SECONDS="$API_TIMEOUT_SECONDS"
          --env CORS_ORIGINS="$CORS_ORIGINS"
          --env CORS_ORIGIN_REGEX="$CORS_ORIGIN_REGEX"
          --env UPSTREAM_OPENAPI_URL="$UPSTREAM_OPENAPI_URL"
          --env UPSTREAM_OPENAPI_FETCH_TIMEOUT="$UPSTREAM_OPENAPI_FETCH_TIMEOUT"
          --env OPENAPI_CACHE_PATH="$OPENAPI_CACHE_PATH"
          --env REQUEST_LOGS_COLLECTION="$REQUEST_LOGS_COLLECTION"
          --env REQUEST_LOG_TTL_SECONDS="$REQUEST_LOG_TTL_SECONDS"

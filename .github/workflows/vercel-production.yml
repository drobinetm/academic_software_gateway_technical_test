name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
      LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
      INNOVASOFT_BASE_URL: ${{ secrets.INNOVASOFT_BASE_URL }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
      API_TIMEOUT_SECONDS: ${{ secrets.API_TIMEOUT_SECONDS }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      UPSTREAM_OPENAPI_URL: ${{ secrets.UPSTREAM_OPENAPI_URL }}
      UPSTREAM_OPENAPI_FETCH_TIMEOUT: ${{ secrets.UPSTREAM_OPENAPI_FETCH_TIMEOUT }}
      OPENAPI_CACHE_PATH: ${{ secrets.OPENAPI_CACHE_PATH }}
      REQUEST_LOGS_COLLECTION: ${{ secrets.REQUEST_LOGS_COLLECTION }}
      REQUEST_LOG_TTL_SECONDS: ${{ secrets.REQUEST_LOG_TTL_SECONDS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel output
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        run: >-
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          --env ENVIRONMENT="$ENVIRONMENT"
          --env LOG_LEVEL="$LOG_LEVEL"
          --env INNOVASOFT_BASE_URL="$INNOVASOFT_BASE_URL"
          --env MONGODB_URI="$MONGODB_URI"
          --env MONGODB_DATABASE="$MONGODB_DATABASE"
          --env API_TIMEOUT_SECONDS="$API_TIMEOUT_SECONDS"
          --env CORS_ORIGINS="$CORS_ORIGINS"
          --env UPSTREAM_OPENAPI_URL="$UPSTREAM_OPENAPI_URL"
          --env UPSTREAM_OPENAPI_FETCH_TIMEOUT="$UPSTREAM_OPENAPI_FETCH_TIMEOUT"
          --env OPENAPI_CACHE_PATH="$OPENAPI_CACHE_PATH"
          --env REQUEST_LOGS_COLLECTION="$REQUEST_LOGS_COLLECTION"
          --env REQUEST_LOG_TTL_SECONDS="$REQUEST_LOG_TTL_SECONDS"

[tool.poetry]
name = "innovasoft-proxy-gateway"
version = "0.1.0"
description = "FastAPI gateway/proxy between a React frontend and the Innovasoft S.A. API."
authors = ["Innovasoft Proxy Team <dev@example.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.scripts]
refresh-openapi = "src.scripts.refresh_upstream_openapi:main"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
httpx = "^0.27.2"
motor = "^3.6.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
email-validator = "^2.2.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
respx = "^0.21.1"
mongomock-motor = "^0.0.34"
black = "^24.10.0"
isort = "^5.13.2"
flake8 = "^7.1.1"
pylint = "^3.3.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.pylint.main]
py-version = "3.10"
ignore = ["tests"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "duplicate-code",
    "broad-exception-caught",
    "redefined-outer-name",
    "no-member",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 8
max-attributes = 12
